services:
  - type: web
    name: examflow
    runtime: python
    # Free demo deployment: the service sleeps when idle and local SQLite data
    # is temporary. Use this only for presentation/testing, not production.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: START_SCHEDULER
        value: "true"
      - key: START_SCHEDULER
        value: "false"
